<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock checkout</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #121826; color: #121826; font: 15px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Inter, sans-serif; padding: 16px; }
  .card { background: #fff; border-radius: 16px; padding: 28px; max-width: 380px; width: 100%; }
  .tag { display: inline-block; background: #FF7A45; color: #121826; font: 700 11px/1 ui-monospace, Menlo, monospace; padding: 5px 8px; border-radius: 999px; letter-spacing: .05em; }
  .amt { font-size: 34px; font-weight: 800; margin: 16px 0 2px; }
  p { color: #6B7080; margin: 0 0 4px; }
  button { margin-top: 20px; width: 100%; font: 600 15px/1 inherit; font-family: inherit; background: #4F6BFF; color: #fff; border: 0; border-radius: 10px; padding: 14px; cursor: pointer; }
  button:disabled { opacity: .5; }
</style>
</head>
<body>
<form class="card" method="post">
  <span class="tag">MOCK · NO REAL MONEY</span>
  <div class="amt">{{amount}}</div>
  <p>{{description}}</p>
  <p>{{email}}</p>
  <p>Status: {{status}}</p>
  <button onclick="this.textContent='Paying…'">Pay {{amount}}</button>
</form>
</body>
</html>
