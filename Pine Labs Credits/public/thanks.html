<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provn · Payment</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F3F1EA; color: #121826; font: 15px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Inter, sans-serif; padding: 16px; }
  .card { background: #fff; border: 1px solid #E2DED3; border-radius: 16px; padding: 32px; max-width: 420px; width: 100%; text-align: center; }
  .logo { font-weight: 800; } .logo b { color: #4F6BFF; }
  h1 { font-size: 22px; margin: 18px 0 6px; }
  p { color: #6B7080; margin: 0; }
  .credits { font-size: 40px; font-weight: 800; color: #4F6BFF; margin: 14px 0 0; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">Provn <b>Credits</b></div>
  <h1 id="h">Checking your payment…</h1>
  <div class="credits" id="c"></div>
  <p id="p">This takes a few seconds.</p>
</div>
<script>
  const ref = new URLSearchParams(location.search).get("ref");
  let tries = 0;
  async function check() {
    const r = await fetch("/api/thanks?ref=" + encodeURIComponent(ref)).then((x) => x.json()).catch(() => ({}));
    if (r.granted) {
      document.getElementById("h").textContent = "Payment received";
      document.getElementById("c").textContent = "+" + r.credits.toLocaleString() + " credits";
      document.getElementById("p").textContent = "They're in your Provn balance now. You can close this tab.";
    } else if (++tries < 15 && !["CANCELLED", "EXPIRED"].includes(r.status)) {
      setTimeout(check, 2000);
    } else {
      document.getElementById("h").textContent = r.status ? "Payment not confirmed yet" : "We couldn't find this payment";
      document.getElementById("p").textContent = "If money left your account, credits will appear once Pine Labs confirms it.";
    }
  }
  check();
</script>
</body>
</html>
